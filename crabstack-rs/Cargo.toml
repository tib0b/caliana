[package]
name = "crabstack"
version = "0.1.0"
edition = "2021"
description = "Rust port of pystackreg / TurboReg subpixel image registration (Thevenaz pyramid method)"
license = "BSD-3-Clause"

[lib]
name = "crabstack"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

[features]
# Enables the Python extension module (built by maturin). Off by default so
# `cargo test` / `cargo build` need no Python toolchain.
#
# `abi3-py310` builds against CPython's stable ABI, so one wheel per platform
# covers 3.10 and every later CPython, instead of one per (platform, version).
# It costs nothing here: the only C-API traffic is two calls per frame, and the
# numeric work runs with the GIL released behind them.
python = ["dep:pyo3", "dep:numpy", "pyo3/abi3-py310"]

[profile.release]
opt-level = 3
# Whole-program optimization across the small signal-processing helpers that
# dominate registration; a single codegen unit lets the optimizer inline the
# per-pixel kernels into the AVX2 dispatch wrappers, which is where the
# vectorization actually happens.
lto = "fat"
codegen-units = 1
