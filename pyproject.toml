[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caliana"
description = "Analysis of plant calcium imaging data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "LICENSE",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "tifffile",
    # Registration (SPEC §3 Stage II) runs on `crabstack`, which is not on PyPI
    # and so cannot be listed here — install it separately, see README ▸ Install.
    # Stage I .nd2 loading (lazy, dask-backed; xarray gives named dims)
    "nd2",
    "dask",
    "xarray",
    # GUI widgets (notebook + app). qtpy abstracts the Qt binding; pick one binding.
    "qtpy",
    "pyqtgraph",
    "PySide6",
    # Publication-grade static figures (matplotlib) — see caliana/figures.py
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
caliana = "caliana.app:main"

[tool.setuptools.dynamic]
version = {attr = "caliana.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["caliana*"]
